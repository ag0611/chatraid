[project]
name = "chatraid"
version = "1.0.0"
description = "Turn Twitch chat into a game engine - AI Director, OBS overlay, streamer dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "websockets>=12",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy"]

[project.scripts]
chatraid = "chatraid.app:main"
chatraid-sim = "chatraid.simulator:main"

[tool.setuptools.packages.find]
include = ["chatraid*"]

[tool.setuptools.package-data]
chatraid = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B017"]
